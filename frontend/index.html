<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Explainer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="app-header">
        <div class="header-content">
            <div class="logo">
                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="16 18 22 12 16 6"></polyline>
                    <polyline points="8 6 2 12 8 18"></polyline>
                </svg>
                <h1>Code Explainer</h1>
            </div>
            <div id="session-badge" class="session-badge">
                <span>Kalan Analiz:</span>
                <strong id="remaining-count">10</strong>
            </div>
        </div>
    </header>

    <main class="app-main">
        <!-- Left Panel: Upload -->
        <aside class="panel upload-panel">
            <h2>Dosya Yükle</h2>

            <div id="drop-zone" class="drop-zone">
                <svg xmlns="http://www.w3.org/2000/svg" width="44" height="44" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                    <polyline points="17 8 12 3 7 8"></polyline>
                    <line x1="12" y1="3" x2="12" y2="15"></line>
                </svg>
                <p>Dosyaları sürükleyip bırakın</p>
                <span class="or-divider">veya</span>
                <button id="browse-btn" class="btn btn-secondary">Dosya Seç</button>
                <p class="hint">Python, JavaScript, Java, C, C++ &middot; Maks. 100KB</p>
                <input type="file" id="file-input" multiple accept=".py,.js,.java,.c,.cpp" hidden>
            </div>

            <div id="file-list-section" class="file-list-section hidden">
                <h3 class="file-list-heading">Yüklenen Dosyalar</h3>
                <ul id="files-ul" class="files-ul"></ul>
            </div>

            <button id="analyze-btn" class="btn btn-primary analyze-btn" disabled>
                <span class="btn-text">Analiz Et</span>
                <span class="btn-spinner hidden"></span>
            </button>
        </aside>

        <!-- Right Panel: Results -->
        <section class="panel results-panel">
            <h2>Analiz Sonuçları</h2>
            <div id="results-container" class="results-container">
                <div class="empty-state">
                    <svg xmlns="http://www.w3.org/2000/svg" width="56" height="56" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                        <polyline points="14 2 14 8 20 8"></polyline>
                        <line x1="16" y1="13" x2="8" y2="13"></line>
                        <line x1="16" y1="17" x2="8" y2="17"></line>
                        <polyline points="10 9 9 9 8 9"></polyline>
                    </svg>
                    <p>Bir dosya seçin ve "Analiz Et" butonuna tıklayın</p>
                </div>
            </div>
        </section>
    </main>

    <!-- Error Toast -->
    <div id="error-toast" class="error-toast hidden">
        <span class="toast-icon">⚠</span>
        <span id="error-message"></span>
        <button id="close-toast" class="close-toast" aria-label="Kapat">×</button>
    </div>

    <script src="app.js"></script>
</body>
</html>
